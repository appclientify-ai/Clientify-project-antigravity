            },
            colors: {
              primary: 'var(--app-primary, #4f46e5)',
              secondary: 'var(--app-primary-hover, #6366f1)',
              accent: '#f59e0b',
              surface: '#ffffff',
              glass: 'rgba(255, 255, 255, 0.75)',

            boxShadow: {
              'glass-silk': '0 8px 32px 0 rgba(15, 23, 42, 0.06)',
              'glass-float': '0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 1px 1px rgba(255, 255, 255, 0.8) inset',
              'soft-float': '0 12px 30px -6px rgba(15, 23, 42, 0.08), 0 4px 12px -2px rgba(15, 23, 42, 0.03)',
              'soft-elevate': '0 20px 45px -10px rgba(79, 70, 229, 0.12), 0 6px 16px -3px rgba(15, 23, 42, 0.04)',
            },
            animation: {
              'pulse-priority': 'pulse-priority 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
              'float': 'float 6s ease-in-out infinite',
              'float-slow': 'float 8s ease-in-out infinite',
              'float-reverse': 'float-reverse 7s ease-in-out infinite',
              'pulse-glow': 'pulse-glow 2.5s ease-in-out infinite',
            },
            keyframes: {
              'pulse-priority': {
                '0%, 100%': { opacity: 1, transform: 'scale(1)' },
                '50%': { opacity: .7, transform: 'scale(1.05)' },
              },
              'float': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-8px)' },
              },
              'float-reverse': {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(8px)' },
